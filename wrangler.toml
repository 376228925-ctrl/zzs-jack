name = "qingzhuan-pickleball"
compatibility_date = "2026-11-01"
pages_build_output_dir = "dist"

[vars]
DEEPSEEK_MODEL = "deepseek-flash"
DEEPSEEK_BASE_URL = "https://api.deepseek.com"

# 可选：启用 Cloudflare KV 云端房间同步（多手机实时查看比分）
# 在 Cloudflare Dashboard -> Pages -> Settings -> Functions -> KV namespace bindings
# 添加变量名 TOURNAMENT_KV 并绑定一个免费 KV 命名空间即可自动生效，无需改代码。
